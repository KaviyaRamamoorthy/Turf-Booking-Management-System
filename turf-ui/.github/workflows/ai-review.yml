name: Cursor-AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  lint-and-test:
    name: Lint and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Post Review Summary
        run: echo " Code has been linted and tested. Cursor AI review must be done manually in-editor."
