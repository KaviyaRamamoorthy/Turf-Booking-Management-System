# Database connection pool settings - Reduced for memory constraints
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# Logging Configuration - Minimal logging for production
logging.level.com.turf=WARN
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.mail=ERROR
logging.level.org.springframework.mail.javamail=ERROR
logging.level.org.springframework.web=ERROR
